<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5f1">
  <title>Kasir Kopi — Kedai Senja</title>
  <style>
    :root{--ink:#29251f;--muted:#8d877e;--line:#ece8e1;--paper:#fff;--canvas:#f7f5f1;--coffee:#6d432d;--coffee-dark:#4e3022;--coffee-light:#f4ece5;--green:#2f7a55;--red:#c65045;--shadow:0 12px 36px rgba(57,43,30,.07)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--canvas);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}.topbar{height:76px;padding:0 32px;display:flex;align-items:center;justify-content:space-between;background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:12px}.brand-mark{width:42px;height:42px;display:grid;place-items:center;border-radius:14px;background:var(--coffee);color:#fff;font-size:22px;box-shadow:0 6px 14px #6d432d33}.brand-name{font-size:16px;font-weight:800;letter-spacing:-.4px}.brand-sub{margin-top:2px;color:var(--muted);font-size:11px}.top-right{display:flex;align-items:center;gap:18px}.live-status{display:flex;align-items:center;gap:7px;color:#5b695c;font-size:12px}.live-status:before{content:"";width:8px;height:8px;border-radius:50%;background:#47a66b;box-shadow:0 0 0 4px #47a66b1c}.date-pill{color:#665f56;font-size:12px;background:#f6f3ee;border-radius:20px;padding:9px 13px}.layout{max-width:1600px;margin:auto;padding:27px 30px 35px;display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:25px;align-items:start}.heading{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:21px}.eyebrow{color:var(--coffee);font-size:11px;text-transform:uppercase;letter-spacing:1.5px;font-weight:800;margin-bottom:7px}h1{font-size:clamp(24px,3vw,32px);letter-spacing:-1.2px;margin:0}.heading p{color:var(--muted);font-size:13px;margin:7px 0 0}.search{width:min(300px,38%);position:relative}.search span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#8f887d;font-size:17px}.search input{width:100%;border:1px solid var(--line);background:white;border-radius:12px;padding:12px 14px 12px 40px;outline:none;font-size:13px;transition:.2s}.search input:focus,.cash-input:focus{border-color:#a78268;box-shadow:0 0 0 3px #6d432d12}.category-row{display:flex;gap:9px;overflow-x:auto;padding-bottom:5px;margin-bottom:18px}.category{flex:0 0 auto;border:1px solid var(--line);padding:9px 15px;border-radius:10px;color:#716a61;background:white;font-size:12px;font-weight:650;transition:.18s}.category:hover{border-color:#c8b3a2}.category.active{background:var(--coffee);border-color:var(--coffee);color:white;box-shadow:0 5px 12px #6d432d26}.product-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.product-card{overflow:hidden;background:white;border:1px solid #eeebe6;border-radius:16px;transition:transform .2s,box-shadow .2s}.product-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}.product-visual{height:150px;position:relative;overflow:hidden;background:#eee7df}.product-visual img{width:100%;height:100%;display:block;object-fit:cover;transition:transform .35s}.product-card:hover .product-visual img{transform:scale(1.05)}.product-tag{position:absolute;top:11px;left:11px;font-size:9px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--coffee);background:#ffffffdf;padding:6px 8px;border-radius:6px}.product-body{padding:13px 14px 14px}.product-name{font-size:14px;font-weight:750;letter-spacing:-.2px}.product-desc{height:16px;overflow:hidden;margin-top:4px;color:var(--muted);font-size:10px}.product-foot{margin-top:13px;display:flex;align-items:center;justify-content:space-between;gap:8px}.product-price{font-size:14px;font-weight:800;color:var(--coffee-dark)}.add-button{border:0;color:white;background:var(--coffee);width:32px;height:32px;display:grid;place-items:center;border-radius:10px;font-size:20px;line-height:1;transition:.15s}.add-button:hover{background:var(--coffee-dark);transform:scale(1.06)}.empty-products{grid-column:1/-1;padding:50px 20px;text-align:center;color:var(--muted);background:white;border-radius:14px;border:1px dashed var(--line)}.order-panel{background:white;border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow);overflow:hidden;position:sticky;top:94px}.order-head{padding:19px 20px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.order-title{font-weight:800;font-size:16px;letter-spacing:-.4px}.order-caption{color:var(--muted);font-size:11px;margin-top:4px}.count-badge{background:var(--coffee-light);color:var(--coffee);font-weight:800;font-size:11px;padding:7px 10px;border-radius:20px}.cart-list{padding:7px 19px;max-height:280px;overflow-y:auto;min-height:95px}.cart-empty{height:140px;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:12px}.cart-empty span{display:block;font-size:30px;margin-bottom:8px;opacity:.65}.cart-item{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #f1eee9}.cart-icon{width:38px;height:38px;display:grid;place-items:center;background:#f7f2ed;border-radius:11px;overflow:hidden}.cart-icon img{width:100%;height:100%;object-fit:cover}.cart-name{font-weight:700;font-size:12px}.cart-unit{color:var(--muted);font-size:10px;margin-top:4px}.cart-right{text-align:right}.cart-line-total{font-size:12px;font-weight:750;margin-bottom:6px}.qty-control{display:flex;align-items:center;justify-content:flex-end;gap:8px}.qty-control button{width:22px;height:22px;border:1px solid var(--line);color:var(--coffee);background:white;border-radius:7px;font-weight:700;line-height:1}.qty-control button:hover{background:var(--coffee-light)}.qty-value{font-size:11px;min-width:10px;text-align:center}.order-content{padding:0 20px 19px}.summary{border-top:1px dashed #ddd7ce;padding-top:13px}.summary-row{display:flex;justify-content:space-between;align-items:center;margin:8px 0;font-size:12px;color:#6e685f}.summary-row strong{color:var(--ink);font-weight:700}.summary-row.total{border-top:1px solid var(--line);padding-top:13px;margin-top:13px;color:var(--ink);font-size:14px;font-weight:800}.summary-row.total strong{color:var(--coffee);font-size:20px;letter-spacing:-.6px}.payment-title{font-size:11px;font-weight:800;margin:18px 0 8px}.cash-wrap{position:relative}.currency-prefix{position:absolute;top:50%;left:12px;transform:translateY(-50%);font-size:12px;color:var(--muted);font-weight:700}.cash-input{width:100%;border:1px solid var(--line);outline:none;border-radius:10px;padding:12px 12px 12px 37px;font-size:14px;font-weight:700;transition:.2s}.quick-cash{display:flex;gap:7px;margin-top:8px}.quick-cash button{flex:1;border:1px solid var(--line);border-radius:8px;padding:7px 3px;background:white;color:#70685f;font-size:10px;font-weight:700}.quick-cash button:hover{border-color:#b99d88;color:var(--coffee);background:#fcfaf8}.change-box{display:flex;align-items:center;justify-content:space-between;background:#f1f7f3;border:1px solid #e4efe7;border-radius:10px;padding:11px 12px;margin-top:12px;font-size:11px;color:#52705d}.change-box strong{color:var(--green);font-size:15px}.change-box.insufficient{background:#fff6f4;border-color:#f4e4e0;color:#9a5b52}.change-box.insufficient strong{color:var(--red)}.checkout-button{border:0;background:var(--coffee);color:white;width:100%;margin-top:14px;padding:13px 14px;border-radius:11px;font-size:13px;font-weight:800;box-shadow:0 7px 16px #6d432d28;transition:.2s}.checkout-button:hover:not(:disabled){background:var(--coffee-dark);transform:translateY(-1px)}.checkout-button:disabled{opacity:.42;cursor:not-allowed;box-shadow:none}.clear-button{display:block;margin:10px auto 0;padding:4px 8px;background:none;border:0;color:#a09a91;font-size:10px}.clear-button:hover{color:var(--red)}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:20;padding:11px 17px;border-radius:10px;color:white;background:#302a24;box-shadow:var(--shadow);font-size:12px;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}#receipt{display:none}
    @media(max-width:1050px){.layout{grid-template-columns:minmax(0,1fr) 350px;padding:23px 20px;gap:17px}.product-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.topbar{padding:0 20px}}
    @media(max-width:760px){.topbar{height:66px;padding:0 15px}.date-pill{display:none}.layout{display:flex;flex-direction:column;padding:21px 14px 25px}.menu-section,.order-panel{width:100%}.order-panel{position:static}.heading{align-items:start;flex-direction:column}.search{width:100%}.product-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.product-visual{height:125px}.product-body{padding:11px}.product-desc{font-size:9px}.top-right{gap:0}}
    @media(max-width:370px){.product-grid{grid-template-columns:1fr}.product-visual{height:160px}}
    @media print{@page{size:80mm auto;margin:5mm}body{background:#fff;color:#000}body *{visibility:hidden!important}#receipt,#receipt *{visibility:visible!important}#receipt{display:block!important;position:absolute;left:0;top:0;width:70mm;font-family:"Courier New",monospace;font-size:11px;color:#000}.receipt-center{text-align:center}.receipt-brand{font-size:18px;font-weight:bold;letter-spacing:1px}.receipt-muted{font-size:10px}.receipt-rule{border-top:1px dashed #000;margin:9px 0}.receipt-row{display:flex;justify-content:space-between;gap:6px;margin:4px 0}.receipt-product{margin:7px 0}.receipt-product-name{font-weight:bold}.receipt-total{font-weight:bold;font-size:13px}.receipt-thanks{margin-top:15px}}
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar"><div class="brand"><div class="brand-mark" aria-hidden="true">☕</div><div><div class="brand-name">Kedai Acong jr</div><div class="brand-sub">Sistem kasir • Coffee &amp; good days</div></div></div><div class="top-right"><div class="live-status">Kasir siap</div><div class="date-pill" id="todayDate"></div></div></header>
    <main class="layout">
      <section class="menu-section"><div class="heading"><div><div class="eyebrow">Menu kedai</div><h1>Mau pesan apa hari ini?</h1><p>Pilih menu favorit, lalu tambahkan ke pesanan.</p></div><label class="search"><span>⌕</span><input id="searchInput" type="search" placeholder="Cari menu..." aria-label="Cari menu"></label></div><div class="category-row" id="categoryRow" aria-label="Kategori menu"></div><div class="product-grid" id="productGrid"></div></section>
      <aside class="order-panel" aria-label="Pesanan dan pembayaran"><div class="order-head"><div><div class="order-title">Pesanan saat ini</div><div class="order-caption" id="orderCaption">Belum ada pesanan</div></div><div class="count-badge" id="itemCount">0 item</div></div><div class="cart-list" id="cartList"></div><div class="order-content"><div class="summary"><div class="summary-row"><span>Subtotal</span><strong id="subtotal">Rp0</strong></div><div class="summary-row"><span>Pajak (10%)</span><strong id="tax">Rp0</strong></div><div class="summary-row total"><span>Total</span><strong id="total">Rp0</strong></div></div><div class="payment-title">Uang masuk / pembayaran tunai</div><div class="cash-wrap"><span class="currency-prefix">Rp</span><input class="cash-input" id="cashInput" type="number" min="0" step="1000" placeholder="Masukkan uang pelanggan" inputmode="numeric"></div><div class="quick-cash" id="quickCash"><button type="button" data-amount="20000">Rp20 rb</button><button type="button" data-amount="50000">Rp50 rb</button><button type="button" data-amount="100000">Rp100 rb</button><button type="button" data-amount="exact">Uang pas</button></div><div class="change-box" id="changeBox"><span id="changeLabel">Kembalian</span><strong id="changeAmount">Rp0</strong></div><button type="button" class="checkout-button" id="checkoutButton" disabled>Bayar &amp; Cetak Struk　↗</button><button type="button" class="clear-button" id="clearButton">Kosongkan pesanan</button></div></aside>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div><section id="receipt" aria-hidden="true"></section>
  <script>
    // Gambar menu memakai URL foto Unsplash. Ganti nilai image dengan URL gambar produk milik kedai Anda.
    const products = [
      {id:1,name:'Kopi Susu Senja',category:'Kopi',price:22000,image:'https://images.unsplash.com/photo-1509042239860-f550ce710b93?auto=format&fit=crop&w=700&q=85',tag:'Favorit',desc:'Espresso, susu, gula aren'},
      {id:2,name:'Cappuccino',category:'Kopi',price:25000,image:'https://images.unsplash.com/photo-1572442388796-11668a67e53d?auto=format&fit=crop&w=700&q=85',tag:'Klasik',desc:'Espresso dengan foam lembut'},
      {id:3,name:'Caffè Latte',category:'Kopi',price:25000,image:'https://images.unsplash.com/photo-1461023058943-07fcbe16d735?auto=format&fit=crop&w=700&q=85',tag:'',desc:'Espresso dan steamed milk'},
      {id:4,name:'Americano',category:'Kopi',price:20000,image:'https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?auto=format&fit=crop&w=700&q=85',tag:'',desc:'Espresso dengan air pilihan'},
      {id:5,name:'Caramel Macchiato',category:'Kopi',price:28000,image:'https://images.unsplash.com/photo-1485808191679-5f86510681a2?auto=format&fit=crop&w=700&q=85',tag:'Manis',desc:'Susu, espresso, karamel'},
      {id:6,name:'Matcha Latte',category:'Non-Kopi',price:26000,image:'https://images.unsplash.com/photo-1515823064-d6e0c04616a7?auto=format&fit=crop&w=700&q=85',tag:'Best seller',desc:'Matcha premium dan susu'},
      {id:7,name:'Chocolate',category:'Non-Kopi',price:24000,image:'https://images.unsplash.com/photo-1542990253-0b8be3e1e8e7?auto=format&fit=crop&w=700&q=85',tag:'',desc:'Cokelat pekat yang creamy'},
      {id:8,name:'Lemon Tea',category:'Non-Kopi',price:18000,image:'https://images.unsplash.com/photo-1517701604599-bb29b565090c?auto=format&fit=crop&w=700&q=85',tag:'Segar',desc:'Teh pilihan dengan lemon'},
      {id:9,name:'Croissant Butter',category:'Makanan',price:19000,image:'https://images.unsplash.com/photo-1555507036-ab1f4038808a?auto=format&fit=crop&w=700&q=85',tag:'',desc:'Pastry renyah, freshly baked'},
      {id:10,name:'Banana Bread',category:'Makanan',price:17000,image:'https://images.unsplash.com/photo-1608198093002-ad4e0054846d?auto=format&fit=crop&w=700&q=85',tag:'',desc:'Roti pisang lembut homemade'},
      {id:11,name:'French Fries',category:'Makanan',price:22000,image:'https://images.unsplash.com/photo-1573080496219-bb080dd4f877?auto=format&fit=crop&w=700&q=85',tag:'',desc:'Kentang goreng dengan saus'},
      {id:12,name:'Air Mineral',category:'Lainnya',price:8000,image:'https://images.unsplash.com/photo-1523362628745-0c100150b504?auto=format&fit=crop&w=700&q=85',tag:'',desc:'Air mineral dingin'}
    ];
    const TAX_RATE=0.1;let cart={};let activeCategory='Semua';let toastTimer;
    const rupiah=value=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(value).replace(/\u00a0/g,' ');
    function setDate(){document.getElementById('todayDate').textContent=new Intl.DateTimeFormat('id-ID',{weekday:'short',day:'numeric',month:'short',year:'numeric'}).format(new Date())}
    function renderCategories(){const categories=['Semua',...new Set(products.map(item=>item.category))];document.getElementById('categoryRow').innerHTML=categories.map(category=>`<button class="category ${activeCategory===category?'active':''}" type="button" data-category="${category}">${category}</button>`).join('');document.querySelectorAll('.category').forEach(button=>button.addEventListener('click',()=>{activeCategory=button.dataset.category;renderCategories();renderProducts()}))}
    function renderProducts(){const query=document.getElementById('searchInput').value.trim().toLowerCase();const filtered=products.filter(item=>(activeCategory==='Semua'||item.category===activeCategory)&&`${item.name} ${item.category} ${item.desc}`.toLowerCase().includes(query));const grid=document.getElementById('productGrid');if(!filtered.length){grid.innerHTML='<div class="empty-products">Menu tidak ditemukan. Coba kata kunci lain.</div>';return}grid.innerHTML=filtered.map(item=>`<article class="product-card"><div class="product-visual"><img src="${item.image}" alt="${item.name}" loading="lazy" onerror="this.onerror=null;this.src='https://placehold.co/700x450/f1e9e0/6d432d?text=Foto+Menu'"><span class="product-tag" ${item.tag?'':'hidden'}>${item.tag}</span></div><div class="product-body"><div class="product-name">${item.name}</div><div class="product-desc">${item.desc}</div><div class="product-foot"><span class="product-price">${rupiah(item.price)}</span><button class="add-button" type="button" data-add="${item.id}" aria-label="Tambah ${item.name}">+</button></div></div></article>`).join('');grid.querySelectorAll('[data-add]').forEach(button=>button.addEventListener('click',()=>addToCart(Number(button.dataset.add))))}
    function addToCart(id){cart[id]=(cart[id]||0)+1;renderCart();showToast(`${products.find(item=>item.id===id).name} ditambahkan`)}
    function changeQty(id,difference){cart[id]=(cart[id]||0)+difference;if(cart[id]<=0)delete cart[id];renderCart()}
    function getTotals(){const subtotal=Object.entries(cart).reduce((sum,[id,qty])=>sum+products.find(item=>item.id===Number(id)).price*qty,0);const tax=Math.round(subtotal*TAX_RATE);return{subtotal,tax,total:subtotal+tax}}
    function renderCart(){const list=document.getElementById('cartList');const entries=Object.entries(cart);const itemCount=entries.reduce((sum,[,qty])=>sum+qty,0);document.getElementById('itemCount').textContent=`${itemCount} item`;document.getElementById('orderCaption').textContent=itemCount?`${itemCount} produk dalam pesanan`:'Belum ada pesanan';if(!entries.length){list.innerHTML='<div class="cart-empty"><div><span>🛍️</span>Pesanan masih kosong.<br>Pilih menu untuk memulai.</div></div>'}else{list.innerHTML=entries.map(([id,qty])=>{const item=products.find(product=>product.id===Number(id));return`<div class="cart-item"><div class="cart-icon"><img src="${item.image}" alt="" onerror="this.style.display='none'"></div><div><div class="cart-name">${item.name}</div><div class="cart-unit">${rupiah(item.price)} / item</div></div><div class="cart-right"><div class="cart-line-total">${rupiah(item.price*qty)}</div><div class="qty-control"><button type="button" data-qty="${id}" data-diff="-1" aria-label="Kurangi ${item.name}">−</button><span class="qty-value">${qty}</span><button type="button" data-qty="${id}" data-diff="1" aria-label="Tambah ${item.name}">+</button></div></div></div>`}).join('');list.querySelectorAll('[data-qty]').forEach(button=>button.addEventListener('click',()=>changeQty(Number(button.dataset.qty),Number(button.dataset.diff))))}const totals=getTotals();document.getElementById('subtotal').textContent=rupiah(totals.subtotal);document.getElementById('tax').textContent=rupiah(totals.tax);document.getElementById('total').textContent=rupiah(totals.total);updatePayment()}
    function updatePayment(){const cash=Number(document.getElementById('cashInput').value)||0;const total=getTotals().total;const enough=cash>=total&&total>0;const box=document.getElementById('changeBox');box.classList.toggle('insufficient',cash>0&&!enough);document.getElementById('changeLabel').textContent=cash>0&&!enough?'Uang kurang':'Kembalian';document.getElementById('changeAmount').textContent=cash>0&&!enough?rupiah(total-cash):rupiah(Math.max(0,cash-total));document.getElementById('checkoutButton').disabled=!enough}
    function showToast(message){const toast=document.getElementById('toast');toast.textContent=message;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),1800)}
    function buildReceipt(){const totals=getTotals();const cash=Number(document.getElementById('cashInput').value)||0;const now=new Date();const transactionId=`KS${now.getTime().toString().slice(-8)}`;const items=Object.entries(cart).map(([id,qty])=>{const item=products.find(product=>product.id===Number(id));return`<div class="receipt-product"><div class="receipt-product-name">${item.name}</div><div class="receipt-row"><span>${qty} x ${rupiah(item.price)}</span><span>${rupiah(item.price*qty)}</span></div></div>`}).join('');document.getElementById('receipt').innerHTML=`<div class="receipt-center"><div class="receipt-brand">KEDAI SENJA</div><div>Coffee &amp; good days</div><div class="receipt-muted">Terima kasih sudah mampir!</div></div><div class="receipt-rule"></div><div class="receipt-row"><span>No. Transaksi</span><span>${transactionId}</span></div><div class="receipt-row"><span>Tanggal</span><span>${new Intl.DateTimeFormat('id-ID',{dateStyle:'short',timeStyle:'short'}).format(now)}</span></div><div class="receipt-rule"></div>${items}<div class="receipt-rule"></div><div class="receipt-row"><span>Subtotal</span><span>${rupiah(totals.subtotal)}</span></div><div class="receipt-row"><span>Pajak (10%)</span><span>${rupiah(totals.tax)}</span></div><div class="receipt-row receipt-total"><span>TOTAL</span><span>${rupiah(totals.total)}</span></div><div class="receipt-rule"></div><div class="receipt-row"><span>Tunai</span><span>${rupiah(cash)}</span></div><div class="receipt-row"><span>Kembalian</span><span>${rupiah(cash-totals.total)}</span></div><div class="receipt-center receipt-thanks">Sampai jumpa kembali ☕<br><span class="receipt-muted">Semoga harimu menyenangkan</span></div>`}
    document.getElementById('searchInput').addEventListener('input',renderProducts);document.getElementById('cashInput').addEventListener('input',updatePayment);document.getElementById('quickCash').addEventListener('click',event=>{const button=event.target.closest('button[data-amount]');if(!button)return;const value=button.dataset.amount==='exact'?getTotals().total:Number(button.dataset.amount);document.getElementById('cashInput').value=value||'';updatePayment()});document.getElementById('clearButton').addEventListener('click',()=>{if(!Object.keys(cart).length)return;cart={};document.getElementById('cashInput').value='';renderCart();showToast('Pesanan berhasil dikosongkan')});document.getElementById('checkoutButton').addEventListener('click',()=>{if(document.getElementById('checkoutButton').disabled)return;buildReceipt();window.print()});setDate();renderCategories();renderProducts();renderCart();
  </script>
</body>
</html>
